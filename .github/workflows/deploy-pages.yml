name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install review hub dependencies
        working-directory: review
        run: npm ci

      - name: Build and test review hub
        working-directory: review
        run: |
          npm run build
          npm test

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css menu-data.js order-builder.js script.js cursor.js .nojekyll _site/
          cp -R images _site/images
          cp -R en de articles _site/
          cp sitemap.xml robots.txt _site/
          cp -R music _site/music
          mkdir -p _site/review
          cp -R review/dist/. _site/review/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
